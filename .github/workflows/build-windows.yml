name: Build Windows desktop app
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/UniToStudyHub/UniToStudyHub.csproj
      - run: dotnet build src/UniToStudyHub/UniToStudyHub.csproj --configuration Release --no-restore
      - run: dotnet publish src/UniToStudyHub/UniToStudyHub.csproj --configuration Release --runtime win-x64 --self-contained true /p:PublishSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: UniToStudyHub-win-x64
          path: src/UniToStudyHub/bin/Release/net10.0-windows/win-x64/publish/
          if-no-files-found: error
