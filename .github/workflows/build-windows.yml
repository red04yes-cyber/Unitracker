name: Build Windows desktop app
on:
  push:
    branches: [ main, develop, 'work/**' ]
  pull_request:
    branches: [ main, develop, 'work/**' ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/UniToStudyHub.Tests/UniToStudyHub.Tests.csproj
      - run: dotnet test tests/UniToStudyHub.Tests/UniToStudyHub.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=minimal"
      - run: dotnet restore src/UniToStudyHub/UniToStudyHub.csproj
      - run: dotnet build src/UniToStudyHub/UniToStudyHub.csproj --configuration Release --no-restore
      - run: dotnet publish src/UniToStudyHub/UniToStudyHub.csproj --configuration Release --runtime win-x64 --self-contained true /p:PublishSingleFile=true
      - name: Smoke test published WPF application
        shell: pwsh
        run: ./scripts/windows-startup-smoke.ps1
      - name: Create portable ZIP and SHA-256
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniToStudyHub-win-x64-portable
          path: |
            artifacts/UniToStudyHub-*-win-x64-portable.zip
            artifacts/UniToStudyHub-*-win-x64-portable.zip.sha256
          if-no-files-found: error
