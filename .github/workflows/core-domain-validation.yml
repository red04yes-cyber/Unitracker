name: Core domain Windows validation

on:
  pull_request:
    branches: [ feature/core-domain, work/studyhub-uiux ]
  push:
    branches:
      - feature/core-domain
      - work/core-domain-correction
      - work/windows-validation-hardening
      - work/freebuff-studyhub-features
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-domain-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Restore, test, build, publish and smoke-test on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore tests/UniToStudyHub.Tests/UniToStudyHub.Tests.csproj

      - name: Run tests
        run: dotnet test tests/UniToStudyHub.Tests/UniToStudyHub.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=minimal"

      - name: Restore WPF app
        run: dotnet restore src/UniToStudyHub/UniToStudyHub.csproj --runtime win-x64

      - name: Build WPF app
        run: dotnet build src/UniToStudyHub/UniToStudyHub.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Publish Windows x64
        run: dotnet publish src/UniToStudyHub/UniToStudyHub.csproj --configuration Release --runtime win-x64 --self-contained true /p:PublishSingleFile=true --no-restore

      - name: WPF startup smoke test
        shell: pwsh
        run: ./scripts/windows-startup-smoke.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniToStudyHub-win-x64-core-domain
          path: src/UniToStudyHub/bin/Release/net10.0-windows/win-x64/publish/
          if-no-files-found: error
