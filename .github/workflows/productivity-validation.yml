name: Productivity feature validation

on:
  pull_request:
    branches: [ work/studyhub-uiux ]
  push:
    branches: [ work/chatgpt-student-productivity-features ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: productivity-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tests
        run: dotnet restore tests/UniToStudyHub.Tests/UniToStudyHub.Tests.csproj
      - name: Run tests
        run: dotnet test tests/UniToStudyHub.Tests/UniToStudyHub.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=minimal"

  windows-build:
    name: WPF Windows build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore application
        run: dotnet restore src/UniToStudyHub/UniToStudyHub.csproj
      - name: Build application
        run: dotnet build src/UniToStudyHub/UniToStudyHub.csproj --configuration Release --no-restore
